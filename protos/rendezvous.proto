syntax = "proto3";
package hbb;

message RegisterPeer {
  string id = 1;
  int32 serial = 2;
}

enum ConnType {
  DEFAULT_CONN = 0;
  FILE_TRANSFER = 1;
  PORT_FORWARD = 2;
  RDP = 3;
  VIEW_CAMERA = 4;
  TERMINAL = 5;
}

message RegisterPeerResponse { bool request_pk = 2; }

message PunchHoleRequest { 
  string id = 1; 
  NatType nat_type = 2;
  string licence_key = 3;
  ConnType conn_type = 4;
  string token = 5;
  string version = 6;
  int32 udp_port = 7;
  bool force_relay = 8;
  int32 upnp_port = 9;
  bytes socket_addr_v6 = 10;
  // TBFDesk TODO 8: who is asking. Until this field existed the controller's identity
  // was smuggled inside `version` as "<version> nemo-source-v1:<id>:<b64 uuid>[:token]",
  // and on the relay path inside `licence_key` -- fields meant for something else, so
  // every gate that keys off the controller (per-user connection ACL, require-login,
  // per-session permissions, the blocklist) depended on a string the server had to
  // carve up, and a client that merely omitted the marker read as "anonymous" rather
  // than as a protocol error. A real field makes the identity explicit and typed; the
  // old marker stays readable so an un-updated server keeps working.
  NemoSource nemo_source = 11;
}

// TBFDesk TODO 8: the controller's own identity on a connection request.
//
// This is ASSERTED, not proved -- exactly like the marker it replaces. What proves a
// controller is the device-key handshake (NemoClientAuth), which binds the whole
// connection to one peer id; the server prefers that proof wherever both exist and
// treats this as a hint. The value of the field is that it is unambiguous and cannot
// collide with the version string it used to share.
message NemoSource {
  // The controller's own peer id.
  string id = 1;
  // Its machine uuid, raw rather than base64 now that it has a bytes field to live in.
  bytes uuid = 2;
  // The logged-in user's session token, when there is one. A bearer credential: the
  // client attaches it ONLY on a confidential socket (see the client's
  // nemo_source_marker), and the server reads it to resolve the user whose policy and
  // connection ACL apply.
  string token = 3;
}

message ControlPermissions {
  enum Permission {
    keyboard = 0;
    remote_printer = 1;
    clipboard = 2;
    file = 3;
    audio = 4;
    camera = 5;
    terminal = 6;
    tunnel = 7;
    restart = 8;
    recording = 9;
    block_input = 10;
    remote_modify = 11;
    privacy_mode = 12;
  }
  uint64 permissions = 1;
}

message PunchHole {
  bytes socket_addr = 1;
  string relay_server = 2;
  NatType nat_type = 3;
  int32 udp_port = 4;
  bool force_relay = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
  ControlPermissions control_permissions = 8;
}

message TestNatRequest {
  int32 serial = 1;
}

// per my test, uint/int has no difference in encoding, int not good for negative, use sint for negative
message TestNatResponse {
  int32 port = 1; 
  ConfigUpdate cu = 2; // for mobile
}

enum NatType {
  UNKNOWN_NAT = 0;
  ASYMMETRIC = 1;
  SYMMETRIC = 2;
}

message PunchHoleSent {
  bytes socket_addr = 1;
  string id = 2;
  string relay_server = 3;
  NatType nat_type = 4;
  string version = 5;
  int32 upnp_port = 6;
  bytes socket_addr_v6 = 7;
}

message RegisterPk {
  string id = 1;
  bytes uuid = 2;
  bytes pk = 3;
  string old_id = 4;
  bool no_register_device = 5;
}

message RegisterPkResponse {
  enum Result {
    OK = 0;
    UUID_MISMATCH = 2;
    ID_EXISTS = 3;
    TOO_FREQUENT = 4;
    INVALID_ID_FORMAT = 5;
    NOT_SUPPORT = 6;
    SERVER_ERROR = 7;
    NOT_DEPLOYED = 8;
  }
  Result result = 1;
  int32 keep_alive = 2;
}

message PunchHoleResponse {
  bytes socket_addr = 1;
  bytes pk = 2;
  enum Failure {
    ID_NOT_EXIST = 0;
    OFFLINE = 2;
    LICENSE_MISMATCH = 3;
    LICENSE_OVERUSE = 4;
  }
  Failure failure = 3;
  string relay_server = 4;
  oneof union {
    NatType nat_type = 5;
    bool is_local = 6;
  }
  string other_failure = 7;
  int32 feedback = 8;
  bool is_udp = 9;
  int32 upnp_port = 10;
  bytes socket_addr_v6 = 11;
}

message ConfigUpdate {
  int32 serial = 1;
  repeated string rendezvous_servers = 2;
}

message RequestRelay {
  string id = 1;
  string uuid = 2;
  bytes socket_addr = 3;
  string relay_server = 4;
  bool secure = 5;
  string licence_key = 6;
  ConnType conn_type = 7;
  string token = 8;
  ControlPermissions control_permissions = 9;
  // TBFDesk TODO 8: see PunchHoleRequest.nemo_source. On this path the marker rode in
  // `licence_key`, which the server has to blank before forwarding the frame to the
  // workstation -- the field also carries the user's session token, and forwarding it
  // whole once handed a technician's bearer token to every machine they connected to.
  NemoSource nemo_source = 10;
}

message RelayResponse {
  bytes socket_addr = 1;
  string uuid = 2;
  string relay_server = 3;
  oneof union {
    string id = 4;
    bytes pk = 5;
  }
  string refuse_reason = 6;
  string version = 7;
  int32 feedback = 9;
  bytes socket_addr_v6 = 10;
  int32 upnp_port = 11;
}

message SoftwareUpdate { string url = 1; }

// if in same intranet, punch hole won't work both for udp and tcp,
// even some router has below connection error if we connect itself,
//  { kind: Other, error: "could not resolve to any address" },
// so we request local address to connect.
message FetchLocalAddr {
  bytes socket_addr = 1;
  string relay_server = 2;
  bytes socket_addr_v6 = 3;
  ControlPermissions control_permissions = 4;
}

message LocalAddr {
  bytes socket_addr = 1;
  bytes local_addr = 2;
  string relay_server = 3;
  string id = 4;
  string version = 5;
  bytes socket_addr_v6 = 6;
}

message PeerDiscovery {
  string cmd = 1;
  string mac = 2;
  string id = 3;
  string username = 4;
  string hostname = 5;
  string platform = 6;
  string misc = 7;
}

message OnlineRequest {
  string id = 1;
  repeated string peers = 2;
}

message OnlineResponse {
  bytes states = 1;
}

message KeyExchange {
  repeated bytes keys = 1; 
}

// H5: the client's half of the rendezvous handshake, carrying a proof that this
// machine is a provisioned fleet member (Layer 1) rather than merely a host that
// knows the server's public key -- which is not a secret, it ships in every client
// config and inside the host=..,key=.. licence name.
//
// It replaces the bare two-element KeyExchange reply. The first two fields are
// exactly what that reply carried; the rest is the proof.
//
// `sig` is Ed25519 over
//     "tbfdesk-rzv-dev-v1" || server_eph_pk || client_box_pk || sealed_key || peer_id
// signed with the device SECRET key whose public half is `device_pub`.
//
// Covering `server_eph_pk` is what makes it fresh: that key is generated per
// connection, so a captured NemoClientAuth cannot be replayed into another one. No
// client nonce and no timestamp are needed, which deliberately keeps the clock out of
// the connection path.
//
// Covering `peer_id` is what stops one leaked device key authenticating the whole
// fleet: the server checks it against the key's registered binding, the same way the
// management API does.
message NemoClientAuth {
  bytes client_box_pk = 1;
  bytes sealed_key = 2;
  bytes device_pub = 3;
  string peer_id = 4;
  bytes sig = 5;
}

message HealthCheck {
  string token = 1;
}

message HeaderEntry {
  string name = 1;
  string value = 2;
}

message HttpProxyRequest {
  string method = 1;
  string path = 2;
  repeated HeaderEntry headers = 3;
  bytes body = 4;
}

message HttpProxyResponse {
  int32 status = 1;
  repeated HeaderEntry headers = 2;
  bytes body = 3;
  string error = 4;
}

message RendezvousMessage {
  oneof union {
    RegisterPeer register_peer = 6;
    RegisterPeerResponse register_peer_response = 7;
    PunchHoleRequest punch_hole_request = 8;
    PunchHole punch_hole = 9;
    PunchHoleSent punch_hole_sent = 10;
    PunchHoleResponse punch_hole_response = 11;
    FetchLocalAddr fetch_local_addr = 12;
    LocalAddr local_addr = 13;
    ConfigUpdate configure_update = 14;
    RegisterPk register_pk = 15;
    RegisterPkResponse register_pk_response = 16;
    SoftwareUpdate software_update = 17;
    RequestRelay request_relay = 18;
    RelayResponse relay_response = 19;
    TestNatRequest test_nat_request = 20;
    TestNatResponse test_nat_response = 21;
    PeerDiscovery peer_discovery = 22;
    OnlineRequest online_request = 23;
    OnlineResponse online_response = 24;
    KeyExchange key_exchange = 25;
    HealthCheck hc = 26;
    HttpProxyRequest http_proxy_request = 27;
    HttpProxyResponse http_proxy_response = 28;
    NemoClientAuth nemo_client_auth = 29;
    NemoSealedAuth nemo_sealed_auth = 30;
  }
}

// T23: a NemoClientAuth sealed to the server's long-term key (Ed25519 -> Curve25519,
// NaCl sealedbox). `sealed` is the serialized inner message, unchanged.
message NemoSealedAuth {
  bytes sealed = 1;
}
